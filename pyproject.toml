[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaritons"
version = "0.1.0"
description = "Self-consistent self-energy and many-body framework for disordered exciton-polaritons."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "The Polaritons Authors" },
]
keywords = ["polaritons", "excitons", "disorder", "self-energy", "condensed-matter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
notebook = ["matplotlib>=3.6", "jupyter"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/mtp354/Polaritons"
Repository = "https://github.com/mtp354/Polaritons"

[tool.setuptools.packages.find]
include = ["polaritons*"]
exclude = ["tests*", "Results*", "Plots*", "data*"]
